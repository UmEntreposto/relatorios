    const html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  }catch(x){
    err.textContent=(x&&x.message==='nocrypto')?'Abra o link em um navegador atualizado (https).':'Senha incorreta.';
    btn.disabled=false;btn.textContent='Abrir relatório';
  }
});
